<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="assets/page-icon.png">
    <title>Login | Senai Inclusão</title>
</head>
<body>
    <header><!--Cabeçalho da logo + botões de acessibilidade-->
        
        <div> <!--Logo-->
            <img src="assets/large-icon.png" alt="SENAI Inclusão">
        </div>
        
        <div> <!--Botões de acessibilidade-->
        
            <button> <!--Contraste-->
                <img src="assets/contrast-icon.png" alt="Botão de Contraste">
                Contraste 
            </button>
        
            <div> <!--Botão de diminuir e de aumentar fonte-->
                <button>A-</button> | <button>A+</button>
            </div>
        
        </div>

    </header>

    <main>

        <div> <!--alguma coisa dizendo que o ambiente é seguro-->
            <div> <!--mensagem bonitinha + check-->
                <img src="assets/check.png" alt="Símbolo verde de check">
                <p id="Ambiente-protegido">Ambiente protegido, inclusivo e feito para você aprender com autonomia</p>
            </div>
            <img src="assets/alunos-login-page.png" alt="Alunos diversos interagindo entre si"> <!--imagem bonitinha proposta-->
        </div>

        <div> <!--área para fazer o login-->
            <h2>Portal de Aprendizagem</h2>
            <h1>Acesse sua conta</h1>
            <p>Entre com seus dados para continuar sua jornada de aprendizagem.</p>
            
            <form action="">
            <p>Usuário</p>
            <label for="Usuario">
                <img src="assets/user.png" alt="Bonequinho de usuário">
                <input type="text" placeholder="Insira sua matrícula">
            </label>
            
            <p>Senha</p>
            <label for="Senha">
                <img src="assets/locker.png" alt="Cadeado">
                <input type="text" placeholder="Insira sua senha">
                <button><img src="assets/eye.png" alt="Ver senha"></button>
            </label>
            
            <label for="Lembrar-acesso">
                <input type="checkbox">Lembrar meu acesso
            </label>
            
            <a href="inserir pagina de senha">Esqueci minha senha</a>
            
            <button type="submit">Entrar</button>
            </form>

            <p>Primeiro acesso</p> <!--add tracinhos de cada lado-->
            <img src="assets/question.png">
            <p>Precisa de ajuda para acessar? <a href="uma tela de suporte">Fale com o suporte</a></p>

        </div>

    </main>
</body>
</html>
